name: CI

on:
  pull_request:
    paths:
      - "cli/**"
      - "plugins/**"
      - "examples/**"
      - "vscode/**"
      - "python/**"
      - "docs/**"
      - "mrsf.schema.json"
      - "mrsf-config.schema.json"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "vitest.config.ts"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "plugins/**"
      - "examples/**"
      - "vscode/**"
      - "python/**"
      - "docs/**"
      - "mrsf.schema.json"
      - "mrsf-config.schema.json"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "vitest.config.ts"
  workflow_dispatch:

jobs:
  library-validation:
    name: Libraries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Type-check, build and test libraries in dependency order
        run: |
          for package in cli plugins/shared mcp plugins/monaco plugins/milkdown plugins/tiptap; do
            npm --prefix "$package" ci
            npm --prefix "$package" run lint
            npm --prefix "$package" run build
            npm --prefix "$package" test
          done

  python-validation:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and validation tools
        run: python -m pip install ".[dev]" build
      - name: Lint
        run: python -m ruff check .
      - name: Type-check
        run: python -m mypy src
      - name: Run full test suite
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build

  vscode-compatibility:
    name: VS Code ${{ matrix.version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.version == 'insiders' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        version: ["1.137.0", stable]
        include:
          - os: ubuntu-latest
            version: insiders
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare extension dependencies
        run: |
          npm --prefix cli ci
          npm --prefix cli run build
          npm --prefix plugins/monaco ci
          npm --prefix vscode ci
      - name: Type-check and unit tests
        run: |
          npm --prefix vscode run lint
          npm --prefix vscode test
      - name: Host smoke tests (Windows)
        if: runner.os == 'Windows'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.version }}
        run: npm --prefix vscode run test:host
      - name: Host smoke tests (Linux)
        if: runner.os == 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.version }}
        run: xvfb-run -a npm --prefix vscode run test:host
      - name: Upload host failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-host-${{ matrix.os }}-${{ matrix.version }}
          path: vscode/.vscode-test/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Verify VSIX packaging
        run: npm --prefix vscode run package -- --out sidemark-smoke.vsix

  renderer-coverage:
    name: Renderer Coverage (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: markdown-it
            path: plugins/markdown-it
          - name: rehype
            path: plugins/rehype
          - name: marked
            path: plugins/marked
          - name: marp
            path: plugins/marp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build CLI library
        run: |
          cd cli
          npm ci
          npm run build

      - name: Build shared plugin library
        run: |
          cd plugins/shared
          npm ci
          npm run build

      - name: Build and test ${{ matrix.package.name }}
        run: |
          cd ${{ matrix.package.path }}
          npm ci
          npm run lint
          npm run build
          npm test -- --coverage

  editor-builds:
    name: Documentation And Demo Builds
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build all documentation and demo dependencies
        run: |
          for package in cli plugins/shared plugins/markdown-it plugins/rehype plugins/marked plugins/marp plugins/monaco plugins/milkdown plugins/tiptap; do
            npm --prefix "$package" ci
            npm --prefix "$package" run build
          done

      - name: Build documentation
        run: |
          npm --prefix docs ci
          npm --prefix docs run docs:build

      - name: Build all example demos and run example tests
        run: |
          cd examples
          npm install --package-lock=false
          npm run demo:marp:build
          npm run demo:milkdown:build
          npm run demo:monaco:build
          npm run demo:tiptap:build
          npm run test:monaco-demo