name: CI

on:
  pull_request:
    paths:
      - "cli/**"
      - "plugins/**"
      - "examples/**"
      - "vscode/**"
      - "python/**"
      - "rust/**"
      - "evaluation/reanchor/**"
      - "docs/**"
      - "MRSF-v1.0.md"
      - "mrsf.schema.json"
      - "mrsf-config.schema.json"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "vitest.config.ts"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "plugins/**"
      - "examples/**"
      - "vscode/**"
      - "python/**"
      - "rust/**"
      - "evaluation/reanchor/**"
      - "docs/**"
      - "MRSF-v1.0.md"
      - "mrsf.schema.json"
      - "mrsf-config.schema.json"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "vitest.config.ts"
  workflow_dispatch:

jobs:
  rust-validation:
    name: Rust ${{ matrix.toolchain }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests and documentation examples
        run: cargo test --locked --all-features
      - name: Verify published package contents and build
        run: cargo package --locked
      - name: Check published-crate sample formatting
        run: cargo fmt --manifest-path ../examples/rust-sdk/Cargo.toml --all -- --check
      - name: Lint published-crate samples
        run: cargo clippy --locked --manifest-path ../examples/rust-sdk/Cargo.toml --all-targets -- -D warnings
      - name: Test published-crate samples
        run: cargo test --locked --manifest-path ../examples/rust-sdk/Cargo.toml --all-targets
      - name: Run comment lifecycle sample
        run: cargo run --locked --manifest-path ../examples/rust-sdk/Cargo.toml
      - name: Run reanchoring sample
        run: cargo run --locked --manifest-path ../examples/rust-sdk/Cargo.toml --example reanchor
      - uses: actions/setup-python@v6
        if: matrix.toolchain == 'stable'
        with:
          python-version: "3.13"
      - name: Check bundled schemas match canonical schemas
        if: matrix.toolchain == 'stable'
        run: |
          python -c "from pathlib import Path; names = ('mrsf.schema.json', 'mrsf-config.schema.json'); mismatches = [n for n in names if Path('schemas', n).read_bytes() != Path('..', n).read_bytes()]; assert not mismatches, f'Bundled schemas differ: {mismatches}'"
      - name: Verify sample uses the crates.io release
        if: matrix.toolchain == 'stable'
        run: |
          cargo metadata --locked --manifest-path ../examples/rust-sdk/Cargo.toml --format-version 1 | python -c "import json, sys; packages = [p for p in json.load(sys.stdin)['packages'] if p['name'] == 'mrsf']; assert len(packages) == 1, packages; sdk = packages[0]; assert sdk['version'] == '0.1.0' and sdk['source'] == 'registry+https://github.com/rust-lang/crates.io-index', sdk; print('Verified published mrsf ' + sdk['version'])"

  rust-interoperability:
    name: Rust / Node / Python Interoperability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build Node SDK
        run: |
          npm --prefix cli ci
          npm --prefix cli run build
      - name: Install Python SDK
        run: python -m pip install -e ./python
      - name: Exercise all producer, updater, and reader combinations
        run: python examples/test-rust-interop.py

  library-validation:
    name: Libraries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Type-check, build and test libraries in dependency order
        run: |
          for package in cli plugins/shared mcp plugins/monaco plugins/milkdown plugins/tiptap; do
            npm --prefix "$package" ci
            npm --prefix "$package" run lint
            npm --prefix "$package" run build
            npm --prefix "$package" test
          done

  python-validation:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and validation tools
        run: python -m pip install ".[dev]" build
      - name: Lint
        run: python -m ruff check .
      - name: Type-check
        run: python -m mypy src
      - name: Run full test suite
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build

  vscode-compatibility:
    name: VS Code ${{ matrix.version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.version == 'insiders' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        version: ["1.137.0", stable]
        include:
          - os: ubuntu-latest
            version: insiders
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare extension dependencies
        run: |
          npm --prefix cli ci
          npm --prefix cli run build
          npm --prefix plugins/monaco ci
          npm --prefix vscode ci
      - name: Type-check and unit tests
        run: |
          npm --prefix vscode run lint
          npm --prefix vscode test
      - name: Host smoke tests (Windows)
        if: runner.os == 'Windows'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.version }}
        run: npm --prefix vscode run test:host
      - name: Host smoke tests (Linux)
        if: runner.os == 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.version }}
        run: xvfb-run -a npm --prefix vscode run test:host
      - name: Upload host failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-host-${{ matrix.os }}-${{ matrix.version }}
          path: vscode/.vscode-test/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Verify VSIX packaging
        run: npm --prefix vscode run package -- --out sidemark-smoke.vsix

  renderer-coverage:
    name: Renderer Coverage (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: markdown-it
            path: plugins/markdown-it
          - name: rehype
            path: plugins/rehype
          - name: marked
            path: plugins/marked
          - name: marp
            path: plugins/marp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build CLI library
        run: |
          cd cli
          npm ci
          npm run build

      - name: Build shared plugin library
        run: |
          cd plugins/shared
          npm ci
          npm run build

      - name: Build and test ${{ matrix.package.name }}
        run: |
          cd ${{ matrix.package.path }}
          npm ci
          npm run lint
          npm run build
          npm test -- --coverage

  editor-builds:
    name: Documentation And Demo Builds
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build all documentation and demo dependencies
        run: |
          for package in cli plugins/shared plugins/markdown-it plugins/rehype plugins/marked plugins/marp plugins/monaco plugins/milkdown plugins/tiptap; do
            npm --prefix "$package" ci
            npm --prefix "$package" run build
          done

      - name: Build documentation
        run: |
          npm --prefix docs ci
          npm --prefix docs run docs:build

      - name: Build all example demos and run example tests
        run: |
          cd examples
          npm install --package-lock=false
          npm run demo:marp:build
          npm run demo:milkdown:build
          npm run demo:monaco:build
          npm run demo:tiptap:build
          npm run test:monaco-demo